<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work — Estudos e Pesquisas</title>
    <link rel="stylesheet" href="https://sdk.openui5.org/1.120.0/resources/sap/ui/core/themes/sap_fiori_3/library.css">
    <script id="sap-ui-bootstrap"
            src="https://sdk.openui5.org/1.120.0/resources/sap-ui-core.js"
            data-sap-ui-theme="sap_fiori_3"
            data-sap-ui-libs="sap.m, sap.ui.layout, sap.ui.core"
            data-sap-ui-compatVersion="edge"
            data-sap-ui-async="true"
            data-sap-ui-oninit="module:app/main">
    </script>
    <style>
        .sapUiBody { background: #f4f4f4; }
        .customShell { height: 100vh; display: flex; flex-direction: column; }
        .tileContainer { padding: 2rem; flex: 1; }
        .tileWrapper { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; max-width: 1200px; margin: 0 auto; }
        .headerBar { background: #1d3459; color: white; padding: 1rem 2rem; }
        .headerTitle { font-size: 1.5rem; font-weight: 300; }
        .headerSubtitle { font-size: 0.875rem; opacity: 0.8; margin-top: 0.25rem; }
        .sectionTitle { color: #1d3459; font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem; padding-left: 0.5rem; border-left: 4px solid #0070f2; }
        .footerBar { background: #f4f4f4; border-top: 1px solid #d9d9d9; padding: 1rem 2rem; text-align: center; color: #6b6b6b; font-size: 0.75rem; }
    </style>
</head>
<body class="sapUiBody" role="application">
    <div class="customShell">
        <header class="headerBar" role="banner">
            <div class="headerTitle">Work</div>
            <div class="headerSubtitle">Estudos, Pesquisas e Projetos Pessoais</div>
        </header>

        <main class="tileContainer" role="main">
            <div class="tileWrapper">
                <section>
                    <div class="sectionTitle">Pesquisa MCP Platform</div>
                    <div class="tileWrapper" id="mcpResearch"></div>
                </section>
            </div>
        </main>

        <footer class="footerBar" role="contentinfo">
            <span>Repositório: edmaker89/work &nbsp;|&nbsp; GitHub Pages &nbsp;|&nbsp; Última atualização: <span id="lastUpdate"></span></span>
        </footer>
    </div>

    <script>
        sap.ui.define([
            "sap/m/GenericTile",
            "sap/m/TileContent",
            "sap/ui/core/Icon"
        ], function(GenericTile, TileContent, Icon) {
            "use strict";

            const mcpResearch = [
                {
                    title: "Pesquisa Principal (Markdown)",
                    desc: "Documento completo com visão geral, arquitetura e descobertas",
                    icon: "sap-icon://document-text",
                    href: "research/mcp-platform/mcp-platform-research.md",
                    color: "#0070f2"
                },
                {
                    title: "Pesquisa Completa (HTML)",
                    desc: "Versão HTML completa com formatação rica",
                    icon: "sap-icon://html5",
                    href: "research/mcp-platform/mcp-platform-research.html",
                    color: "#0070f2"
                },
                {
                    title: "Corpo da Pesquisa",
                    desc: "Conteúdo principal extraído (HTML)",
                    icon: "sap-icon://detail-view",
                    href: "research/mcp-platform/mcp-platform-body.html",
                    color: "#107e3e"
                },
                {
                    title: "Versão Intermediária",
                    desc: "Rascunho intermediário da pesquisa (HTML)",
                    icon: "sap-icon://edit",
                    href: "research/mcp-platform/mcp-platform-research-intermediate.html",
                    color: "#107e3e"
                },
                {
                    title: "Sumário (TOC)",
                    desc: "Índice e estrutura de navegação",
                    icon: "sap-icon://list",
                    href: "research/mcp-platform/mcp-platform-toc.html",
                    color: "#107e3e"
                }
            ];

            function createTile(item) {
                return new GenericTile({
                    header: item.title,
                    subheader: "",
                    frameType: "TwoByOne",
                    press: function() { window.open(item.href, "_blank"); },
                    tileContent: new TileContent({
                        footer: item.desc,
                        content: new Icon({
                            src: item.icon,
                            size: "2.5rem",
                            color: item.color
                        })
                    })
                }).addStyleClass("sapUiSmallMarginEnd").addStyleClass("sapUiSmallMarginBottom");
            }

            const container = document.getElementById("mcpResearch");

            mcpResearch.forEach(item => {
                const tile = createTile(item);
                tile.placeAt(container);
            });

            document.getElementById("lastUpdate").textContent = new Date().toLocaleDateString("pt-BR");
        });
    </script>
</body>
</html>
